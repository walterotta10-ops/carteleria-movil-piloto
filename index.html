<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ef1d32">
  <title>Nuevo C&amp;D Cartelería</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#17263e;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,520px);background:white;border:1px solid #e2e8f0;border-top:5px solid #ef1d32;border-radius:16px;padding:32px;box-shadow:0 10px 35px #17263e12}h1{margin:0 0 18px;font-size:27px}p{line-height:1.6;color:#526175}a,button{display:block;width:100%;padding:14px;border-radius:9px;text-align:center;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}a{background:#ef1d32;color:white}button{margin-top:12px;border:1px solid #cbd5e1;background:white;color:#17263e}button[hidden]{display:none}
  </style>
</head>
<body>
  <main class="card">
    <h1>Nuevo C&amp;D Cartelería</h1>
    <p id="status" role="status">Abriendo la versión actualizada…</p>
    <a href="https://carteleria-puente-carta.walterotta10.workers.dev/">Abrir Cartelería actualizada</a>
    <button type="button" id="retry" hidden>Reintentar transferencia</button>
    <noscript><p>Presiona «Abrir Cartelería actualizada» para continuar. La transferencia de colas requiere JavaScript.</p></noscript>
  </main>
  <script src="https://carteleria-puente-carta.walterotta10.workers.dev/queue-sync.js?v=v39-cola-compartida-y-uso"></script>
  <script>
    'use strict';
    const target='https://carteleria-puente-carta.walterotta10.workers.dev/';
    const statusBox=document.getElementById('status');
    const retryButton=document.getElementById('retry');
    async function migrateAndOpen(){
      retryButton.hidden=true;
      statusBox.textContent='Revisando carteles guardados en este equipo…';
      try{
        const locals=new Set();
        // La información original permanece guardada en el navegador de Render.
        // Se transfieren solo las identidades de carteles; el destino usa precios
        // y formatos del catálogo actual, igual que al abrir desde el celular.
        for(let i=0;i<localStorage.length;i++){
          const key=localStorage.key(i);
          const old=/^carteleria\.queue\.(\d{1,6})$/.exec(key || '');
          const pending=/^carteleria\.sync\.v39\.(\d{1,6})\.op\./.exec(key || '');
          if(old){
            const queue=JSON.parse(localStorage.getItem(key) || '[]');
            if(!Array.isArray(queue))throw new Error('Una cola guardada no tiene un formato válido.');
            if(queue.length)locals.add(old[1]);
          }
          if(pending)locals.add(pending[1]);
        }
        if(locals.size){
          if(!window.CARTELERIA_SYNC)throw new Error('No se pudo conectar con la versión nueva.');
          const shared=window.CARTELERIA_SYNC.create({
            storage:localStorage,apiUrl:target+'api/cola',
            onStatus(value){statusBox.textContent='Transfiriendo cola del local '+value.local+'…';}
          });
          for(const local of locals){
            const queue=JSON.parse(localStorage.getItem('carteleria.queue.'+local) || '[]');
            if(!Array.isArray(queue) || queue.some(item=>!item || !item.signId || !item.campaignId || !item.code))
              throw new Error('La cola del local '+local+' necesita revisión antes de transferirse.');
            shared.select(local,queue);
            if(!await shared.sync())throw new Error('No se pudo confirmar la cola del local '+local+'.');
          }
          shared.stop();
        }
        statusBox.textContent='Listo. Abriendo Cartelería actualizada…';
        window.location.replace(target);
      }catch(error){
        statusBox.textContent=error.message+' Los datos originales siguen guardados en este navegador. Reintenta para transferirlos antes de continuar.';
        retryButton.hidden=false;
      }
    }
    retryButton.onclick=migrateAndOpen;
    const transfer=migrateAndOpen();
  </script>
</body>
</html>
